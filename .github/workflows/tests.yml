name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  js:
    name: JS transformation and file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  jsonpath:
    name: JSONPATH expressions with Jayway JsonPath 2.10.0 (openHAB's library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: sh test/jsonpath/run.sh
  live:
    name: Live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm run test:live
